spring.application.name=mercato-backend

cart.item.reservation.minutes=45
cart.reservation.cleanup.interval.ms=900000

order.payment.abandonment.hours=48
order.payment.abandonment.cleanup.interval.ms=3600000

cart.shipping.threshold=999
cart.shipping.charge=50
cart.platform.fee=12
cart.delivery.expedited-surcharge=49
cart.delivery.standard-cap=250

# Bounded mail attempts for the durable seller notice outbox.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# File upload settings
file.upload.dir=${FILE_UPLOAD_DIR}
file.base.url=${FILE_BASE_URL}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mvc.async.request-timeout=30000
spring.mvc.pathmatch.use-suffix-pattern=false

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
