server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
server.ssl.enabled=false
server.forward-headers-strategy=none
mercato.ingress.enabled=true
mercato.ingress.keys=${NETLIFY_PROXY_KEYS}
mercato.ingress.site-id=${NETLIFY_SITE_ID}
mercato.ingress.site-url=${NETLIFY_SITE_URL}
mercato.ingress.contexts=${NETLIFY_DEPLOY_CONTEXTS:production}
mercato.ingress.legacy-webhook-enabled=${LEGACY_CASHFREE_ADAPTER_ENABLED:false}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.phone=${ADMIN_PHONE}

frontend.base.url=${FRONTEND_BASE_URL}
images.base.url=${IMAGES_BASE_URL}
file.base.url=${frontend.base.url}

# Caddy owns HTTPS and certificate renewal; Spring stays on loopback.

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.default-encoding=UTF-8

# Email sender configuration
mercato.email.from=${EMAIL_FROM}

# Email verification settings
mercato.email.verification.expiry-hours=24
mercato.email.reports.enabled=${EMAIL_REPORTS_ENABLED:true}
mercato.email.reports.zone=Asia/Kolkata

# JWT
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_TTL}

#cashfree
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.base.url=${CASHFREE_BASE_URL}
cashfree.api.version=${CASHFREE_API_VERSION}
cashfree.return.url=${CASHFREE_RETURN_URL}
cashfree.notify.url=${CASHFREE_NOTIFY_URL}

# User Account Cleanup Configuration
# Account access history is retained. The automatic account deletion job is retired.
mercato.account.cleanup.enabled=false

# Private database/job-loop monitor; URLs and recipients come from the deployment environment.
mercato.operations.enabled=true
mercato.operations.heartbeat-url=${HEALTHCHECKS_WORKER_PING_URL:}
mercato.operations.alert-email=${OPS_ALERT_EMAIL:${ADMIN_EMAIL}}

logging.level.org.springframework.security=ERROR
logging.level.org.hibernate=ERROR
