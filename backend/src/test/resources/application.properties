spring.datasource.url=jdbc:h2:mem:mercato-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
mercato.jobs.enabled=false

jwt.secret=test-jwt-secret-key-at-least-32-characters-long
jwt.expiration.ms=3600000
jwt.guest.expiration.ms=86400000

cashfree.app.id=test-app-id
cashfree.secret.key=test-secret-key
cashfree.base.url=https://sandbox.cashfree.com/pg
cashfree.api.version=2023-08-01
cashfree.return.url=http://localhost:5173/checkout/payment-confirmation
cashfree.notify.url=http://localhost:8080/api/public/cashfree/webhook

mercato.email.from=test@mercato.test
frontend.base.url=http://localhost:5173

file.upload.dir=./target/test-uploads
file.base.url=http://localhost:8080/images

spring.mail.host=localhost
spring.mail.port=1025

cart.item.reservation.minutes=45
cart.reservation.cleanup.interval.ms=900000
cart.shipping.threshold=999
cart.shipping.charge=50
cart.platform.fee=12
